<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NGP Music</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0712;
      color: white;
    }

    header {
      padding: 25px 20px;
      background: linear-gradient(135deg, #241044, #10081d);
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #a879ff;
    }

    .tagline {
      margin-top: 6px;
      color: #aaa;
    }

    .search {
      margin: 20px;
      padding: 15px;
      width: calc(100% - 40px);
      border: none;
      border-radius: 12px;
      background: #21182d;
      color: white;
      font-size: 16px;
    }

    section {
      padding: 10px 20px 100px;
    }

    h2 {
      margin: 20px 0 15px;
    }

    .cards {
      display: flex;
      gap: 15px;
      overflow-x: auto;
    }

    .card {
      min-width: 150px;
      background: #191222;
      padding: 12px;
      border-radius: 15px;
    }

    .cover {
      width: 100%;
      height: 130px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7b3ff2, #e040fb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
    }

    .song {
      margin-top: 10px;
      font-weight: bold;
    }

    .artist {
      margin-top: 5px;
      color: #999;
      font-size: 13px;
    }

    .player {
      position: fixed;
      bottom: 60px;
      left: 10px;
      right: 10px;
      background: #21182d;
      padding: 12px;
      border-radius: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .play {
      background: #9b5cff;
      border: none;
      color: white;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      font-size: 20px;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #120c19;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #2b2135;
    }

    nav div {
      color: #aaa;
      font-size: 13px;
      text-align: center;
    }

    nav div:first-child {
      color: #a879ff;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🎵 NGP Music</div>
    <div class="tagline">More Than Music</div>
  </header>

  <input class="search" type="text
